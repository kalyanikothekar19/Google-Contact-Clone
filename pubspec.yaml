name: MyContacts
description: A simple contacts app built with Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_bloc: ^8.1.3
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.0
  image_picker: ^1.0.4
  url_launcher: ^6.2.1
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/MyContacts.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icons/ 